<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador</title>
<style>
  :root{
    --bg-top:#1b1b22; --bg-bottom:#262630;
    --panel-normal:#eef0f4; --panel-fg:#101418;
    --red-bg:#d64343; --green-bg:#2fb56b;
    --accent:#5aa2ff; --text:#e8eaf0; --text-dim:#9aa0ac;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh; padding:20px 16px 32px;
    font-family:"Segoe UI",Inter,Roboto,system-ui,-apple-system,sans-serif;
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);
    color:var(--text); -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
  }
  .app{ width:100%; max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:22px; }
  .header{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:0 4px; }
  .header h1{ margin:0; font-size:18px; font-weight:600; letter-spacing:.3px; }
  .header .hint{ font-size:12.5px; color:var(--text-dim); }
  .columns{ display:flex; gap:16px; align-items:stretch; }
  .column{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:12px;
    padding:18px 16px 16px; border-radius:16px; background:var(--panel); color:var(--fg);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
    transition:background-color .22s ease, color .22s ease, box-shadow .22s ease;
    --panel:var(--panel-normal); --fg:var(--panel-fg);
    --field-bg:#ffffff; --field-border:#d0d4dc; --field-ph:#98a0ad; --divider:rgba(0,0,0,.08);
  }
  .column.red,.column.green{
    --fg:#ffffff; --field-bg:rgba(0,0,0,.22); --field-border:rgba(255,255,255,.35);
    --field-ph:rgba(255,255,255,.65); --divider:rgba(255,255,255,.25);
  }
  .column.red{ --panel:var(--red-bg); box-shadow:0 10px 30px rgba(214,67,67,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .column.green{ --panel:var(--green-bg); box-shadow:0 10px 30px rgba(47,181,107,.35), inset 0 1px 0 rgba(255,255,255,.12); }
  .column input{
    width:100%; padding:10px 12px; font:inherit; font-size:16px; color:var(--fg);
    background:var(--field-bg); border:1px solid var(--field-border); border-radius:10px; outline:none;
    transition:background-color .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
  }
  .column input::placeholder{ color:var(--field-ph); }
  .column input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(90,162,255,.3); }
  .column input.name-edit{
    background:transparent; border:none; border-bottom:2px solid var(--divider); border-radius:0;
    padding:4px 2px 8px; text-align:center; font-weight:600; font-size:15.5px;
    letter-spacing:.5px; text-transform:uppercase;
  }
  .column input.name-edit:focus{ box-shadow:none; border-bottom-color:currentColor; }
  .rows{ display:flex; flex-direction:column; gap:8px; }
  .row-input{ text-align:right; font-variant-numeric:tabular-nums; font-weight:500; }
  .sum{ margin-top:auto; padding-top:12px; border-top:1px solid var(--divider); display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .sum-label{ font-size:12px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; opacity:.7; }
  .sum-value{ font-size:26px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .controls{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:12px;
    padding:14px 16px; font-size:14.5px; color:var(--text-dim);
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.06); border-radius:14px;
  }
  #threshold{
    width:110px; padding:10px 12px; font:inherit; font-size:16px; text-align:center;
    font-variant-numeric:tabular-nums; color:var(--text);
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); border-radius:10px; outline:none;
  }
  #threshold:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(90,162,255,.25); background:rgba(255,255,255,.08); }
  .controls button{
    padding:10px 20px; font:inherit; font-size:14.5px; font-weight:600; letter-spacing:.4px;
    color:var(--text); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; cursor:pointer; transition:background-color .15s ease, border-color .15s ease, transform .1s ease;
  }
  .controls button:hover{ background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.22); }
  .controls button:active{ transform:translateY(1px); }
  #scan{ background:rgba(90,162,255,.18); border-color:rgba(90,162,255,.45); color:#cfe2ff; }
  #scan:hover{ background:rgba(90,162,255,.3); border-color:rgba(90,162,255,.7); }

  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  .modal[hidden]{ display:none; }
  .modal-content{ width:100%; max-width:760px; max-height:96vh; background:#1b1b22;
    border:1px solid rgba(255,255,255,.08); border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .modal-header{ display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.08); }
  .modal-header h2{ margin:0; font-size:16px; font-weight:600; }
  .modal-close{ background:none; border:none; color:var(--text); font-size:22px; cursor:pointer; padding:0 8px; line-height:1; }
  .cam-stage{ position:relative; background:#000; display:flex; align-items:center; justify-content:center;
    min-height:240px; max-height:58vh; overflow:hidden; }
  .cam-stage video,.cam-stage canvas{ max-width:100%; max-height:58vh; display:block; }
  .cam-stage video[hidden],.cam-stage canvas[hidden]{ display:none; }
  .modal-info{ padding:12px 18px; font-size:14px; color:var(--text-dim); text-align:center; min-height:44px; line-height:1.4; }
  .modal-actions{ display:flex; gap:8px; padding:0 18px 18px; flex-wrap:wrap; justify-content:center; }
  .modal-actions button{
    padding:10px 18px; font:inherit; font-size:14.5px; font-weight:600; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--text); border:1px solid rgba(255,255,255,.12);
    transition:background-color .15s ease, border-color .15s ease;
  }
  .modal-actions .btn-primary{ background:var(--accent); color:#0a0e14; border-color:var(--accent); }
  .modal-actions .btn-a{ background:rgba(238,240,244,.9); color:#101418; border-color:rgba(238,240,244,.9); }
  .modal-actions .btn-b{ background:rgba(90,162,255,.85); color:#0a0e14; border-color:rgba(90,162,255,.85); }

  @media (max-width: 480px){
    body{ padding:14px 10px 24px; }
    .column{ padding:14px 12px; gap:10px; border-radius:14px; }
    .columns{ gap:10px; }
    .sum-value{ font-size:22px; }
    .header h1{ font-size:16px; }
    .header .hint{ display:none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Marcador</h1>
    <span class="hint">Los datos se guardan solos · Reiniciar limpia las filas</span>
  </div>
  <div class="columns">
    <section class="column normal" id="col_a">
      <input class="name-edit" type="text" placeholder="Columna A" autocomplete="off">
      <div class="rows"></div>
      <div class="sum"><span class="sum-label">Suma</span><span class="sum-value">0</span></div>
    </section>
    <section class="column normal" id="col_b">
      <input class="name-edit" type="text" placeholder="Columna B" autocomplete="off">
      <div class="rows"></div>
      <div class="sum"><span class="sum-label">Suma</span><span class="sum-value">0</span></div>
    </section>
  </div>
  <div class="controls">
    <label for="threshold">Umbral</label>
    <input id="threshold" type="text" inputmode="decimal" value="150" autocomplete="off">
    <button id="scan" type="button">📷 Escanear fichas</button>
    <button id="reset" type="button">Reiniciar</button>
  </div>
</div>

<div class="modal" id="camModal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2>Escanear fichas de dominó</h2>
      <button class="modal-close" id="camClose" type="button">✕</button>
    </div>
    <div class="cam-stage">
      <video id="camVideo" playsinline autoplay muted></video>
      <canvas id="camCanvas" hidden></canvas>
    </div>
    <div class="modal-info" id="camInfo">
      Apunta la cámara a las fichas y pulsa «Capturar y contar».<br>
      Consejo: fondo oscuro mate, luz uniforme, fichas separadas.
    </div>
    <div class="modal-actions">
      <button id="camCapture" class="btn-primary" type="button">Capturar y contar</button>
      <button id="camRetry" type="button" hidden>↻ Reintentar</button>
      <button id="camAddA" class="btn-a" type="button" hidden>→ Columna A</button>
      <button id="camAddB" class="btn-b" type="button" hidden>→ Columna B</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* ============ Persistencia ============ */
  const STORAGE_KEY = 'marcador_state_v1';
  function readStorage(){
    try{ const raw = localStorage.getItem(STORAGE_KEY); if(!raw) return null;
      const d = JSON.parse(raw); return (d && typeof d === 'object') ? d : null;
    } catch(e){ return null; }
  }
  function writeStorage(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch(e){} }

  /* ============ Numéricas ============ */
  const FLOAT_RE = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;
  const isValidFloat = s => FLOAT_RE.test(s);
  const toFloat = s => { const t=String(s??'').trim(); return isValidFloat(t) ? (parseFloat(t)||0) : 0; };
  const formatNumber = n => {
    if (!Number.isFinite(n)) return '0';
    if (Number.isInteger(n)) return String(n);
    return String(Number(n.toFixed(10)));
  };

  /* ============ Columna ============ */
  class Column {
    constructor(root, onSumChanged, initial = null){
      this.root = root; this.onSumChanged = onSumChanged;
      this.rowsEl = root.querySelector('.rows');
      this.nameEl = root.querySelector('.name-edit');
      this.sumEl  = root.querySelector('.sum-value');
      this.sum    = 0;
      if (initial && typeof initial === 'object'){
        if (typeof initial.name === 'string') this.nameEl.value = initial.name;
        const rows = Array.isArray(initial.rows) ? initial.rows : [];
        if (rows.length > 0){ for (const v of rows) this.addRow(v ?? '', false); }
        else this.addRow('', false);
      } else this.addRow('', false);
      this.nameEl.addEventListener('input', () => { if (this.onSumChanged) this.onSumChanged(); });
      this.updateSum();
    }
    addRow(value = '', focus = true){
      const input = document.createElement('input');
      input.type='text'; input.inputMode='decimal'; input.autocomplete='off';
      input.spellcheck=false; input.placeholder='0'; input.className='row-input'; input.value=value;
      input.addEventListener('input',  () => this.handleInput(input, false));
      input.addEventListener('blur',   () => this.handleInput(input, true));
      input.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); this.handleInput(input, true); }});
      this.rowsEl.appendChild(input);
      if (focus && value === '') input.focus();
      return input;
    }
    isEmpty(el){ return el.value.trim() === ''; }
    handleInput(input, addFocus){
      this.updateSum();
      const val = input.value.trim();
      const isNum = val !== '' && isValidFloat(val);
      const isZero = isNum && parseFloat(val) === 0;
      if (this.isEmpty(input)){
        const next = input.nextElementSibling;
        if (next && this.isEmpty(next)){ next.remove(); this.updateSum(); return; }
      }
      if (isNum && !isZero && this.rowsEl.lastElementChild === input) this.addRow('', addFocus);
    }
    updateSum(){
      let total = 0;
      for (const el of this.rowsEl.children){
        const t = el.value.trim();
        if (t !== '' && isValidFloat(t)) total += parseFloat(t);
      }
      this.sum = total;
      if (this.sumEl) this.sumEl.textContent = formatNumber(total);
      if (this.onSumChanged) this.onSumChanged();
    }
    addValue(v){
      let target = null;
      for (const el of this.rowsEl.children){
        if (el.value.trim() === ''){ target = el; break; }
      }
      if (!target) target = this.addRow('', false);
      target.value = formatNumber(v);
      this.handleInput(target, false);
      this.updateSum();
    }
    resetRows(){
      while (this.rowsEl.children.length > 1) this.rowsEl.removeChild(this.rowsEl.lastElementChild);
      const first = this.rowsEl.firstElementChild;
      if (first) first.value = '';
      this.updateSum();
    }
    getSum(){ return this.sum; }
    getName(){ return this.nameEl.value; }
    getRowValues(){ return Array.from(this.rowsEl.children).map(el => el.value); }
  }

  /* ============ Estado ============ */
  let colA = null, colB = null, loading = true;
  const thresholdEl = document.getElementById('threshold');
  const resetBtn    = document.getElementById('reset');
  const scanBtn     = document.getElementById('scan');

  const setState = (el, state) => {
    el.classList.remove('normal','red','green'); el.classList.add(state);
  };
  function persist(){
    if (loading) return;
    writeStorage({
      threshold: thresholdEl.value,
      colA: { name: colA.getName(), rows: colA.getRowValues() },
      colB: { name: colB.getName(), rows: colB.getRowValues() }
    });
  }
  function updateColors(){
    if (!colA || !colB) return;
    const th = toFloat(thresholdEl.value);
    const sA = colA.getSum(), sB = colB.getSum();
    const aA = sA >= th, aB = sB >= th;
    let stA='normal', stB='normal';
    if (aA && !aB){ stA='green'; stB='red'; }
    else if (aB && !aA){ stA='red'; stB='green'; }
    else if (aA && aB){ stA='red'; stB='red'; }
    setState(colA.root, stA);
    setState(colB.root, stB);
    persist();
  }

  /* =========================================================
     ============  VISIÓN (ficha primero, conservador)  =====
     ========================================================= */

  const PROC_W = 700;

  /* --- Grises + blur 3x3 --- */
  function toGray(imgData, w, h){
    const gray = new Uint8Array(w * h);
    const d = imgData.data;
    for (let i = 0, n = w * h; i < n; i++){
      gray[i] = (d[i*4]*0.299 + d[i*4+1]*0.587 + d[i*4+2]*0.114) | 0;
    }
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++){
      const y0 = y > 0 ? y-1 : 0, y1 = y < h-1 ? y+1 : h-1;
      for (let x = 0; x < w; x++){
        const x0 = x > 0 ? x-1 : 0, x1 = x < w-1 ? x+1 : w-1;
        let s = 0, c = 0;
        for (let ny = y0; ny <= y1; ny++){
          for (let nx = x0; nx <= x1; nx++){ s += gray[ny*w + nx]; c++; }
        }
        out[y*w + x] = (s / c) | 0;
      }
    }
    return out;
  }

  /* --- Otsu --- */
  function otsu(gray){
    const hist = new Uint32Array(256);
    for (let i = 0; i < gray.length; i++) hist[gray[i]]++;
    const total = gray.length;
    let sum = 0;
    for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = -1, thr = 128;
    for (let t = 0; t < 256; t++){
      wB += hist[t]; if (wB === 0) continue;
      const wF = total - wB; if (wF === 0) break;
      sumB += t * hist[t];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const b = wB * wF * (mB - mF) * (mB - mF);
      if (b > max){ max = b; thr = t; }
    }
    return thr;
  }

  /* --- Componentes conexas 4-vecinos --- */
  function connectedComponents(bin, w, h){
    const labels = new Int32Array(w*h).fill(-1);
    const stack  = new Int32Array(w*h);
    const comps  = [];
    for (let y = 0; y < h; y++){
      for (let x = 0; x < w; x++){
        const idx = y*w + x;
        if (!bin[idx] || labels[idx] !== -1) continue;
        const label = comps.length;
        let sp = 0; stack[sp++] = idx; labels[idx] = label;
        let area = 0, minX = x, maxX = x, minY = y, maxY = y, sumX = 0, sumY = 0;
        while (sp > 0){
          const p = stack[--sp];
          const py = (p / w) | 0, px = p - py*w;
          area++; sumX += px; sumY += py;
          if (px < minX) minX = px; if (px > maxX) maxX = px;
          if (py < minY) minY = py; if (py > maxY) maxY = py;
          if (px > 0){     const ni=p-1; if (bin[ni] && labels[ni]===-1){ labels[ni]=label; stack[sp++]=ni; } }
          if (px < w - 1){ const ni=p+1; if (bin[ni] && labels[ni]===-1){ labels[ni]=label; stack[sp++]=ni; } }
          if (py > 0){     const ni=p-w; if (bin[ni] && labels[ni]===-1){ labels[ni]=label; stack[sp++]=ni; } }
          if (py < h - 1){ const ni=p+w; if (bin[ni] && labels[ni]===-1){ labels[ni]=label; stack[sp++]=ni; } }
        }
        const bw = maxX - minX + 1, bh = maxY - minY + 1;
        comps.push({
          label, area, minX, maxX, minY, maxY,
          width: bw, height: bh,
          cx: sumX/area, cy: sumY/area,
          fill: area / (bw * bh)
        });
      }
    }
    return comps;
  }

  /* --- Umbral binario simple --- */
  function threshold(gray, thr, invert){
    const bin = new Uint8Array(gray.length);
    if (invert) for (let i = 0; i < gray.length; i++) bin[i] = gray[i] < thr ? 1 : 0;
    else        for (let i = 0; i < gray.length; i++) bin[i] = gray[i] >= thr ? 1 : 0;
    return bin;
  }

  /* --- ¿Es una ficha? (región grande, compacta, sólida) --- */
  function isTileLike(c, imgW, imgH){
    const imgArea = imgW * imgH;
    const aR = c.area / imgArea;
    if (aR < 0.004 || aR > 0.20) return false;          // 0.4% – 20% de la imagen
    if (c.width < 14 || c.height < 14) return false;    // al menos 14px de lado
    if (c.width > imgW * 0.85 || c.height > imgH * 0.85) return false; // no toda la imagen
    const aspect = Math.max(c.width, c.height) / Math.min(c.width, c.height);
    if (aspect > 4.5) return false;                     // forma alargada razonable
    if (c.fill < 0.42) return false;                    // sólida (rotada ~45° = 0.5)
    if (c.fill > 0.98) return false;                    // demasiado rectangular → mesa
    return true;
  }

  /* --- Detectar fichas con Otsu (polaridad clara) --- */
  function findTiles(gray, w, h){
    const thr = otsu(gray);
    const bin = threshold(gray, thr, false); // brillantes = 1
    const comps = connectedComponents(bin, w, h);
    const tiles = comps.filter(c => isTileLike(c, w, h));

    // Filtrar por consistencia de tamaño (mediana)
    if (tiles.length >= 3){
      const areas = tiles.map(t => t.area).sort((a,b)=>a-b);
      const med = areas[Math.floor(areas.length/2)];
      return tiles.filter(t => t.area >= med*0.40 && t.area <= med*2.60);
    }
    return tiles;
  }

  /* --- Detectar pips DENTRO de una ficha --- */
  function findPipsInTile(gray, w, h, tile){
    // Recuadro interior (con margen para no incluir el borde)
    const margin = Math.max(2, Math.round(Math.min(tile.width, tile.height) * 0.04));
    const rx = tile.minX + margin;
    const ry = tile.minY + margin;
    const rx2 = tile.maxX - margin;
    const ry2 = tile.maxY - margin;
    const rw = rx2 - rx + 1;
    const rh = ry2 - ry + 1;
    if (rw < 10 || rh < 10) return [];

    // Mediana de brillo de los píxeles CLAROS dentro de la ficha (los propios de la ficha)
    const bright = [];
    for (let y = ry; y <= ry2; y++){
      const row = y * w;
      for (let x = rx; x <= rx2; x++){
        const v = gray[row + x];
        if (v > 90) bright.push(v);
      }
    }
    if (bright.length < 30) return [];
    bright.sort((a,b)=>a-b);
    const tileBright = bright[Math.floor(bright.length * 0.75)]; // percentil 75

    // Los pips son oscuros. Umbral relativo al brillo de la ficha.
    const pipThr = Math.max(25, Math.round(tileBright * 0.55));

    // Binarizar la ROI: oscuros dentro de la ficha
    const roiBin = new Uint8Array(rw * rh);
    for (let y = 0; y < rh; y++){
      const row = (ry + y) * w;
      const rowROI = y * rw;
      for (let x = 0; x < rw; x++){
        roiBin[rowROI + x] = gray[row + rx + x] < pipThr ? 1 : 0;
      }
    }

    const comps = connectedComponents(roiBin, rw, rh);

    // Centro de la ficha (en coordenadas globales) para rechazar el pin
    const tcx = (rx + rx2) / 2;
    const tcy = (ry + ry2) / 2;
    const tileMaxDim = Math.max(rw, rh);

    const pips = [];
    for (const c of comps){
      // Área relativa a la ficha
      const aR = c.area / (rw * rh);
      if (aR < 0.0008 || aR > 0.05) continue;
      if (c.width < 2 || c.height < 2) continue;

      // Círculo: relación de aspecto y circularidad
      const asp = Math.max(c.width, c.height) / Math.min(c.width, c.height);
      if (asp > 2.0) continue;
      const rEq = (c.width + c.height) / 4;
      const circ = c.area / (Math.PI * rEq * rEq);
      if (circ < 0.55) continue;

      // Coordenadas globales
      const gx = c.cx + rx;
      const gy = c.cy + ry;

      // Rechazar pin central (a <10% del centro)
      const dx = (gx - tcx) / tileMaxDim;
      const dy = (gy - tcy) / tileMaxDim;
      if (Math.sqrt(dx*dx + dy*dy) < 0.10) continue;

      pips.push({
        cx: gx, cy: gy,
        minX: c.minX + rx, maxX: c.maxX + rx,
        minY: c.minY + ry, maxY: c.maxY + ry,
        width: c.width, height: c.height,
        area: c.area
      });
    }

    // Filtro adaptativo por mediana dentro de la ficha
    if (pips.length >= 3){
      const areas = pips.map(p => p.area).sort((a,b)=>a-b);
      const med = areas[Math.floor(areas.length/2)];
      return pips.filter(p => p.area >= med*0.40 && p.area <= med*2.50);
    }
    return pips;
  }

  /* --- Agrupar pips (solo para overlay) --- */
  function groupPips(pips){
    if (pips.length === 0) return [];
    const areas = pips.map(p => p.area).sort((a,b)=>a-b);
    const med = areas[Math.floor(areas.length/2)];
    const medD = Math.sqrt(med / Math.PI) * 2;
    const maxD = medD * 5.5, maxD2 = maxD * maxD;
    const parent = pips.map((_, i) => i);
    const find = i => { while (parent[i] !== i){ parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const union = (a,b) => { const ra=find(a), rb=find(b); if (ra!==rb) parent[ra]=rb; };
    for (let i=0; i<pips.length; i++){
      for (let j=i+1; j<pips.length; j++){
        const dx=pips[i].cx-pips[j].cx, dy=pips[i].cy-pips[j].cy;
        if (dx*dx+dy*dy < maxD2) union(i,j);
      }
    }
    const map = new Map();
    for (let i=0; i<pips.length; i++){
      const r = find(i);
      if (!map.has(r)) map.set(r, []);
      map.get(r).push(pips[i]);
    }
    return Array.from(map.values());
  }

  /* --- Pipeline completo --- */
  function processFrame(srcCanvas){
    const srcW = srcCanvas.width, srcH = srcCanvas.height;
    const PH = Math.round(srcH * PROC_W / srcW);

    const tmp = document.createElement('canvas');
    tmp.width = PROC_W; tmp.height = PH;
    const tctx = tmp.getContext('2d', { willReadFrequently:true });
    tctx.drawImage(srcCanvas, 0, 0, PROC_W, PH);

    const imgData = tctx.getImageData(0, 0, PROC_W, PH);
    const gray = toGray(imgData, PROC_W, PH);

    // 1) Detectar fichas
    const tiles = findTiles(gray, PROC_W, PH);

    // 2) Si NO hay fichas → no contar nada
    if (tiles.length === 0){
      return { tiles: [], pips: [], groups: [], total: 0, reason: 'no-tiles' };
    }

    // 3) Buscar pips dentro de cada ficha
    let allPips = [];
    for (const tile of tiles){
      const pips = findPipsInTile(gray, PROC_W, PH, tile);
      allPips.push(...pips);
    }

    // 4) Escalar a resolución original
    const sx = srcW / PROC_W, sy = srcH / PH;
    for (const p of allPips){
      p.cx *= sx; p.cy *= sy;
      p.minX *= sx; p.maxX *= sx;
      p.minY *= sy; p.maxY *= sy;
      p.width *= sx; p.height *= sy;
      p.area *= sx * sy;
    }
    const scaledTiles = tiles.map(t => ({
      minX: t.minX * sx, maxX: t.maxX * sx,
      minY: t.minY * sy, maxY: t.maxY * sy
    }));

    // 5) Corrección por fusión (dos pips pegados = un blob 2× mediano)
    let total = 0;
    if (allPips.length > 0){
      const areas = allPips.map(p => p.area).sort((a,b)=>a-b);
      const med = areas[Math.floor(areas.length/2)];
      for (const p of allPips) total += Math.max(1, Math.round(p.area / med));
    }

    const groups = groupPips(allPips);

    return { tiles: scaledTiles, pips: allPips, groups, total, reason: 'ok' };
  }

  /* ============ Modal cámara ============ */
  const CamScanner = (() => {
    const modal      = document.getElementById('camModal');
    const video      = document.getElementById('camVideo');
    const canvas     = document.getElementById('camCanvas');
    const infoEl     = document.getElementById('camInfo');
    const btnClose   = document.getElementById('camClose');
    const btnCapture = document.getElementById('camCapture');
    const btnRetry   = document.getElementById('camRetry');
    const btnAddA    = document.getElementById('camAddA');
    const btnAddB    = document.getElementById('camAddB');

    let stream = null, result = null;

    function resetUI(){
      result = null;
      video.hidden = false; canvas.hidden = true;
      infoEl.innerHTML = 'Apunta la cámara a las fichas y pulsa «Capturar y contar».<br>Consejo: fondo oscuro mate, luz uniforme, fichas separadas.';
      btnCapture.hidden = false; btnCapture.disabled = false;
      btnRetry.hidden = true; btnAddA.hidden = true; btnAddB.hidden = true;
    }

    async function open(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert('Tu navegador no soporta acceso a la cámara.');
        return;
      }
      resetUI();
      modal.hidden = false;
      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode:{ ideal:'environment' },
                   width:{ ideal:1920 }, height:{ ideal:1080 } },
          audio: false
        });
      } catch(err){
        modal.hidden = true;
        alert('No se pudo acceder a la cámara:\n' + (err.message || err.name));
        return;
      }
      video.srcObject = stream;
      try{ await video.play(); } catch(e){}
    }

    function close(){
      if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
      video.srcObject = null;
      modal.hidden = true;
    }

    function capture(){
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh){ infoEl.textContent = 'La cámara aún no está lista.'; return; }

      canvas.width = vw; canvas.height = vh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, vw, vh);

      let res;
      try{ res = processFrame(canvas); }
      catch(e){ console.error(e); infoEl.textContent = 'Error: ' + e.message; return; }

      result = res;
      drawOverlay(ctx, res);

      video.hidden = true; canvas.hidden = false;

      const tilesN = res.tiles.length;
      const t = res.total;

      if (res.reason === 'no-tiles'){
        infoEl.innerHTML = 'No se detectó ninguna ficha.<br><span style="font-size:12px;opacity:.7">Necesitas que las fichas sean claramente más claras que la mesa. Si la mesa es clara, pon debajo una tela oscura o cartulina negra.</span>';
        btnCapture.hidden = true; btnRetry.hidden = false;
        btnAddA.hidden = true; btnAddB.hidden = true;
      } else if (t === 0){
        infoEl.innerHTML = `Se ven <strong>${tilesN}</strong> ficha(s) pero sin pips legibles.<br><span style="font-size:12px;opacity:.7">Acércate más o mejora la luz para que los pips se distingan.</span>`;
        btnCapture.hidden = true; btnRetry.hidden = false;
        btnAddA.hidden = true; btnAddB.hidden = true;
      } else {
        infoEl.innerHTML =
          `Suma: <strong style="color:#7bb4ff;font-size:1.15em">${t}</strong> pips · ` +
          `<strong>${tilesN}</strong> ficha(s)<br>` +
          `<span style="font-size:12px;opacity:.7">Verde = ficha · Azul = pip · revisa antes de añadir.</span>`;
        btnCapture.hidden = true; btnRetry.hidden = false;
        btnAddA.hidden = false; btnAddB.hidden = false;
      }
    }

    function drawOverlay(ctx, res){
      const W = ctx.canvas.width;
      const baseLW = Math.max(2, Math.round(W / 500));

      // Fichas: recuadro verde discontinuo
      ctx.save();
      ctx.strokeStyle = 'rgba(80,220,120,.9)';
      ctx.lineWidth = baseLW * 1.4;
      ctx.setLineDash([baseLW*5, baseLW*3]);
      for (const t of res.tiles){
        ctx.strokeRect(t.minX, t.minY, t.maxX - t.minX, t.maxY - t.minY);
      }
      ctx.setLineDash([]);
      ctx.restore();

      // Pips: círculos azules
      ctx.save();
      ctx.strokeStyle = 'rgba(90,162,255,.95)';
      ctx.lineWidth = baseLW;
      for (const p of res.pips){
        const r = Math.max(p.width, p.height) * 0.72;
        ctx.beginPath(); ctx.arc(p.cx, p.cy, r, 0, Math.PI*2); ctx.stroke();
      }
      ctx.restore();
    }

    function retry(){ resetUI(); }
    function addTo(column){
      if (!result || !column) return;
      column.addValue(result.total);
      close();
    }

    btnClose.addEventListener('click', close);
    btnCapture.addEventListener('click', capture);
    btnRetry.addEventListener('click', retry);
    btnAddA.addEventListener('click', () => addTo(colA));
    btnAddB.addEventListener('click', () => addTo(colB));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !modal.hidden) close();
    });

    return { open, close };
  })();

  /* ============ Arranque ============ */
  const saved = readStorage();
  if (saved && (typeof saved.threshold === 'string' || typeof saved.threshold === 'number')){
    thresholdEl.value = String(saved.threshold);
  }
  colA = new Column(document.getElementById('col_a'), updateColors, saved ? saved.colA : null);
  colB = new Column(document.getElementById('col_b'), updateColors, saved ? saved.colB : null);

  thresholdEl.addEventListener('input', updateColors);
  resetBtn.addEventListener('click', () => { colA.resetRows(); colB.resetRows(); updateColors(); });
  scanBtn.addEventListener('click', () => CamScanner.open());

  loading = false;
  updateColors();
})();
</script>
</body>
</html>
