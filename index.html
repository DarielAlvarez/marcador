<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marcador</title>

<!-- PWA / offline -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Marcador">

<style>
:root{
  --bg-top: #1b1b22;
  --bg-bottom: #262630;
  --panel-normal:#eef0f4;
  --panel-fg: #101418;
  --red-bg: #d64343;
  --green-bg: #2fb56b;
  --accent: #5aa2ff;
  --text: #e8eaf0;
  --text-dim: #9aa0ac;
}
*{ box-sizing: border-box; }
html, body{ height: 100%; }
body{
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 20px 16px 32px;
  font-family: "Segoe UI", Inter, Roboto, system-ui, -apple-system, sans-serif;
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
.app{
  width: 100%; max-width: 900px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 22px;
}
.header{
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 0 4px;
}
.header h1{ margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .3px; color: var(--text); }
.header .hint{ font-size: 12.5px; color: var(--text-dim); }
.columns{ display: flex; gap: 16px; align-items: stretch; }
.column{
  flex: 1 1 0; min-width: 0;
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px 16px 16px; border-radius: 16px;
  background: var(--panel); color: var(--fg);
  box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  transition: background-color .22s ease, color .22s ease, box-shadow .22s ease;
  --panel: var(--panel-normal);
  --fg: var(--panel-fg);
  --field-bg: #ffffff;
  --field-border: #d0d4dc;
  --field-ph: #98a0ad;
  --divider: rgba(0,0,0,.08);
}
.column.red, .column.green{
  --fg: #ffffff;
  --field-bg: rgba(0, 0, 0, .22);
  --field-border: rgba(255, 255, 255, .35);
  --field-ph: rgba(255, 255, 255, .65);
  --divider: rgba(255, 255, 255, .25);
}
.column.red{
  --panel: var(--red-bg);
  box-shadow: 0 10px 30px rgba(214, 67, 67, .35), inset 0 1px 0 rgba(255,255,255,.12);
}
.column.green{
  --panel: var(--green-bg);
  box-shadow: 0 10px 30px rgba(47, 181, 107, .35), inset 0 1px 0 rgba(255,255,255,.12);
}
.column input{
  width: 100%; padding: 10px 12px; font: inherit; font-size: 16px;
  color: var(--fg); background: var(--field-bg);
  border: 1px solid var(--field-border); border-radius: 10px; outline: none;
  transition: background-color .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease;
}
.column input::placeholder{ color: var(--field-ph); }
.column input:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(90, 162, 255, .3);
}
.column input.name-edit{
  background: transparent; border: none;
  border-bottom: 2px solid var(--divider);
  border-radius: 0; padding: 4px 2px 8px; text-align: center;
  font-weight: 600; font-size: 15.5px; letter-spacing: .5px;
  text-transform: none;
}
.column input.name-edit:focus{ box-shadow: none; border-bottom-color: currentColor; }
.rows{ display: flex; flex-direction: column; gap: 8px; }
.row-input{ text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.sum{
  margin-top: auto; padding-top: 12px;
  border-top: 1px solid var(--divider);
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
}
.sum-label{
  font-size: 12px; font-weight: 600; letter-spacing: 1.2px;
  text-transform: uppercase; opacity: .7;
}
.sum-value{
  font-size: 26px; font-weight: 700; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.controls{
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 12px; padding: 14px 16px; font-size: 14.5px; color: var(--text-dim);
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
  border-radius: 14px;
}
.controls label{ letter-spacing: .3px; }
#threshold{
  width: 110px; padding: 10px 12px; font: inherit; font-size: 16px;
  text-align: center; font-variant-numeric: tabular-nums;
  color: var(--text); background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.12); border-radius: 10px; outline: none;
  transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
}
#threshold:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(90, 162, 255, .25);
  background: rgba(255,255,255,.08);
}
.controls button{
  padding: 10px 20px; font: inherit; font-size: 14.5px; font-weight: 600;
  letter-spacing: .4px; color: var(--text); background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12); border-radius: 10px; cursor: pointer;
  transition: background-color .15s ease, border-color .15s ease, transform .1s ease;
}
.controls button:hover{
  background: rgba(255,255,255,.12);
  border-color: rgba(255,255,255,.22);
}
.controls button:active{ transform: translateY(1px); }
#scan{ background: rgba(90,162,255,.18); border-color: rgba(90,162,255,.45); color: #cfe2ff; }
#scan:hover{ background: rgba(90,162,255,.3); border-color: rgba(90,162,255,.7); }
#scan:disabled{ opacity: .6; cursor: wait; }

/* ===== Modal cámara ===== */
.modal{
  position: fixed; inset: 0; background: rgba(0,0,0,.85);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 16px;
}
.modal[hidden]{ display: none; }
.modal-content{
  width: 100%; max-width: 760px; max-height: 96vh;
  background: #1b1b22; border: 1px solid rgba(255,255,255,.08);
  border-radius: 16px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.55);
}
.modal-header{
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,.08);
}
.modal-header h2{ margin: 0; font-size: 16px; font-weight: 600; }
.modal-close{
  background: none; border: none; color: var(--text);
  font-size: 22px; cursor: pointer; padding: 0 8px; line-height: 1;
}
.modal-close:hover{ color: #fff; }
.cam-stage{
  position: relative; background: #000;
  display: flex; align-items: center; justify-content: center;
  min-height: 240px; max-height: 58vh; overflow: hidden;
}
.cam-stage video, .cam-stage canvas{
  max-width: 100%; max-height: 58vh; display: block;
}
.cam-stage video[hidden], .cam-stage canvas[hidden]{ display: none; }
.modal-info{
  padding: 12px 18px; font-size: 14px; color: var(--text-dim);
  text-align: center; min-height: 44px; line-height: 1.4;
}
.modal-actions{
  display: flex; gap: 8px; padding: 0 18px 18px;
  flex-wrap: wrap; justify-content: center;
}
.modal-actions button{
  padding: 10px 18px; font: inherit; font-size: 14.5px; font-weight: 600;
  border-radius: 10px; cursor: pointer;
  background: rgba(255,255,255,.06); color: var(--text);
  border: 1px solid rgba(255,255,255,.12);
  transition: background-color .15s ease, border-color .15s ease;
}
.modal-actions button:hover{ background: rgba(255,255,255,.12); }
.modal-actions .btn-primary{
  background: var(--accent); color: #0a0e14; border-color: var(--accent);
}
.modal-actions .btn-primary:hover{ background: #7bb4ff; }
.modal-actions .btn-a{
  background: rgba(238,240,244,.9); color: #101418;
  border-color: rgba(238,240,244,.9);
}
.modal-actions .btn-b{
  background: rgba(90,162,255,.85); color: #0a0e14;
  border-color: rgba(90,162,255,.85);
}
@media (max-width: 480px){
  body{ padding: 14px 10px 24px; }
  .column{ padding: 14px 12px; gap: 10px; border-radius: 14px; }
  .columns{ gap: 10px; }
  .sum-value{ font-size: 22px; }
  .header h1{ font-size: 16px; }
  .header .hint{ display: none; }
}
</style>

<body>
<div class="app">
  <div class="header">
    <h1>Marcador</h1>
    <span class="hint">Los datos se guardan solos · Reiniciar limpia las filas</span>
  </div>

  <div class="columns">
    <section class="column normal" id="col_a">
      <input class="name-edit" type="text" placeholder="Columna A" autocomplete="off">
      <div class="rows"></div>
      <div class="sum">
        <span class="sum-label">Suma</span>
        <span class="sum-value">0</span>
      </div>
    </section>

    <section class="column normal" id="col_b">
      <input class="name-edit" type="text" placeholder="Columna B" autocomplete="off">
      <div class="rows"></div>
      <div class="sum">
        <span class="sum-label">Suma</span>
        <span class="sum-value">0</span>
      </div>
    </section>
  </div>

  <div class="controls">
    <label for="threshold">Umbral</label>
    <input id="threshold" type="text" inputmode="decimal" value="150" autocomplete="off">
    <button id="scan" type="button">📷 Escanear fichas</button>
    <button id="reset" type="button">Reiniciar</button>
  </div>
</div>

<!-- ================= Modal cámara ================= -->
<div class="modal" id="camModal" hidden>
  <div class="modal-content">
    <div class="modal-header">
      <h2>Escanear fichas de dominó</h2>
      <button class="modal-close" id="camClose" type="button">✕</button>
    </div>
    <div class="cam-stage">
      <video id="camVideo" playsinline autoplay muted></video>
      <canvas id="camCanvas" hidden></canvas>
    </div>
    <div class="modal-info" id="camInfo">
      Apunta la cámara a las fichas y pulsa «Capturar y contar».<br>
      Consejo: fondo contrastante, luz uniforme, fichas sin solaparse.
    </div>
    <div class="modal-actions">
      <button id="camCapture" class="btn-primary" type="button">Capturar y contar</button>
      <button id="camRetry" type="button" hidden>↻ Reintentar</button>
      <button id="camAddA" class="btn-a" type="button" hidden>→ Columna A</button>
      <button id="camAddB" class="btn-b" type="button" hidden>→ Columna B</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     Persistencia (localStorage)
     ========================================================= */
  const STORAGE_KEY = 'marcador_state_v1';

  function readStorage(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data || typeof data !== 'object') return null;
      return data;
    } catch(e){ return null; }
  }

  function writeStorage(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* modo privado o cuota llena */ }
  }

  /* =========================================================
     Utilidades numéricas
     ========================================================= */
  const FLOAT_RE = /^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?$/;
  function isValidFloat(s){ return FLOAT_RE.test(s); }
  function toFloat(s){
    const t = String(s ?? '').trim();
    if (!isValidFloat(t)) return 0;
    const v = parseFloat(t);
    return Number.isFinite(v) ? v : 0;
  }
  function formatNumber(n){
    if (!Number.isFinite(n)) return '0';
    if (Number.isInteger(n)) return String(n);
    return String(Number(n.toFixed(10)));
  }

  /* =========================================================
     Column
     ========================================================= */
  class Column {
    constructor(root, onSumChanged, initial = null){
      this.root = root;
      this.onSumChanged = onSumChanged;
      this.rowsEl = root.querySelector('.rows');
      this.nameEl = root.querySelector('.name-edit');
      this.sumEl = root.querySelector('.sum-value');
      this.sum = 0;

      if (initial && typeof initial === 'object'){
        if (typeof initial.name === 'string') this.nameEl.value = initial.name;
        const rows = Array.isArray(initial.rows) ? initial.rows : [];
        if (rows.length > 0){
          for (const v of rows) this.addRow(v ?? '', false);
        } else {
          this.addRow('', false);
        }
      } else {
        this.addRow('', false);
      }

      this.nameEl.addEventListener('input', () => {
        if (this.onSumChanged) this.onSumChanged();
      });
      this.updateSum();
    }

    addRow(value = '', focus = true){
      const input = document.createElement('input');
      input.type = 'text';
      input.inputMode = 'decimal';
      input.autocomplete = 'off';
      input.spellcheck = false;
      input.placeholder = '0';
      input.className = 'row-input';
      input.value = value;

      input.addEventListener('input', () => this.handleInput(input, false));
      input.addEventListener('blur', () => this.handleInput(input, true));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ e.preventDefault(); this.handleInput(input, true); }
      });

      this.rowsEl.appendChild(input);
      if (focus && value === '') input.focus();
      return input;
    }

    isEmpty(el){ return el.value.trim() === ''; }

    handleInput(input, addFocus){
      this.updateSum();
      const val = input.value.trim();
      const isNum = val !== '' && isValidFloat(val);
      const isZero = isNum && parseFloat(val) === 0;

      if (this.isEmpty(input)){
        const next = input.nextElementSibling;
        if (next && this.isEmpty(next)){ next.remove(); this.updateSum(); return; }
      }

      if (isNum && !isZero && this.rowsEl.lastElementChild === input){
        this.addRow('', addFocus);
      }
    }

    updateSum(){
      let total = 0;
      for (const el of this.rowsEl.children){
        const t = el.value.trim();
        if (t !== '' && isValidFloat(t)) total += parseFloat(t);
      }
      this.sum = total;
      if (this.sumEl) this.sumEl.textContent = formatNumber(total);
      if (this.onSumChanged) this.onSumChanged();
    }

    addValue(v){
      let target = null;
      for (const el of this.rowsEl.children){
        if (el.value.trim() === ''){ target = el; break; }
      }
      if (!target) target = this.addRow('', false);
      target.value = formatNumber(v);
      this.handleInput(target, false);
      this.updateSum();
    }

    resetRows(){
      while (this.rowsEl.children.length > 1){
        this.rowsEl.removeChild(this.rowsEl.lastElementChild);
      }
      const first = this.rowsEl.firstElementChild;
      if (first) first.value = '';
      this.updateSum();
    }

    getSum(){ return this.sum; }
    getName(){ return this.nameEl.value; }
    getRowValues(){
      return Array.from(this.rowsEl.children).map(el => el.value);
    }
  }

  /* =========================================================
     Estado global
     ========================================================= */
  let colA = null;
  let colB = null;
  let loading = true;

  const thresholdEl = document.getElementById('threshold');
  const resetBtn = document.getElementById('reset');
  const scanBtn = document.getElementById('scan');

  function setState(el, state){
    el.classList.remove('normal', 'red', 'green');
    el.classList.add(state);
  }

  function persist(){
    if (loading) return;
    const state = {
      threshold: thresholdEl.value,
      colA: { name: colA.getName(), rows: colA.getRowValues() },
      colB: { name: colB.getName(), rows: colB.getRowValues() }
    };
    writeStorage(state);
  }

  function updateColors(){
    if (!colA || !colB) return;
    const threshold = toFloat(thresholdEl.value);
    const sumA = colA.getSum();
    const sumB = colB.getSum();
    const aAbove = sumA >= threshold;
    const bAbove = sumB >= threshold;

    let stateA = 'normal';
    let stateB = 'normal';

    if (aAbove && !bAbove){ stateA = 'green'; stateB = 'red'; }
    else if (bAbove && !aAbove){ stateA = 'red'; stateB = 'green'; }
    else if (aAbove && bAbove){ stateA = 'red'; stateB = 'red'; }

    setState(colA.root, stateA);
    setState(colB.root, stateB);
    persist();
  }

  /* =========================================================
     ============ IA: ONNX Runtime Web =============
     ========================================================= */
  const MODEL_URL = 'best.onnx';
  const CONF_THRESHOLD = 0.55;
  const IOU_THRESHOLD = 0.35;
  const INPUT_SIZE = 640;

  let ortSession = null;
  let ortLoadingPromise = null;

  async function loadModel(){
    if (ortSession) return ortSession;
    if (ortLoadingPromise) return ortLoadingPromise;

    ortLoadingPromise = (async () => {
      if (window.ort && ort.env && ort.env.wasm){
        ort.env.wasm.wasmPaths = './';
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.simd = true;
      }

      const sess = await ort.InferenceSession.create(MODEL_URL, {
        executionProviders: ['wasm'],
        graphOptimizationLevel: 'all'
      });
      ortSession = sess;
      return sess;
    })();

    return ortLoadingPromise;
  }

  /* ---------- Preprocesar: letterbox a 640x640 ---------- */
  function preprocess(srcCanvas, size){
    const srcW = srcCanvas.width;
    const srcH = srcCanvas.height;
    const scale = Math.min(size / srcW, size / srcH);
    const newW = Math.round(srcW * scale);
    const newH = Math.round(srcH * scale);
    const padX = (size - newW) / 2;
    const padY = (size - newH) / 2;

    const tmp = document.createElement('canvas');
    tmp.width = size;
    tmp.height = size;
    const ctx = tmp.getContext('2d');
    ctx.fillStyle = '#727272';
    ctx.fillRect(0, 0, size, size);
    ctx.drawImage(srcCanvas, padX, padY, newW, newH);

    const imgData = ctx.getImageData(0, 0, size, size);
    const data = imgData.data;
    const float32 = new Float32Array(3 * size * size);
    const N = size * size;

    for (let i = 0; i < N; i++){
      float32[i]         = data[i * 4]     / 255.0;
      float32[N + i]     = data[i * 4 + 1] / 255.0;
      float32[2 * N + i] = data[i * 4 + 2] / 255.0;
    }

    const tensor = new ort.Tensor('float32', float32, [1, 3, size, size]);
    return { tensor, scale, padX, padY };
  }

  /* ---------- Decodificar salida YOLOv8 [1, 4+nc, N] ---------- */
  function decodeYOLOv8(tensor, confThreshold){
    const data = tensor.data;
    const dims = tensor.dims;
    const numClasses = dims[1] - 4;
    const numBoxes = dims[2];
    const detections = [];

    for (let i = 0; i < numBoxes; i++){
      let maxConf = 0;
      let maxClass = -1;
      for (let c = 0; c < numClasses; c++){
        const val = data[(4 + c) * numBoxes + i];
        if (val > maxConf){ maxConf = val; maxClass = c; }
      }
      if (maxConf < confThreshold) continue;

      const cx = data[0 * numBoxes + i];
      const cy = data[1 * numBoxes + i];
      const w  = data[2 * numBoxes + i];
      const h  = data[3 * numBoxes + i];

      detections.push({
        cx, cy, w, h,
        x1: cx - w / 2,
        y1: cy - h / 2,
        x2: cx + w / 2,
        y2: cy + h / 2,
        conf: maxConf,
        class: maxClass
      });
    }
    return detections;
  }

  /* ---------- NMS ---------- */
  function computeIoU(a, b){
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);
    const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
    const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
    return inter / (areaA + areaB - inter + 1e-6);
  }

  function nms(detections, iouThreshold){
    if (detections.length === 0) return [];
    detections.sort((a, b) => b.conf - a.conf);
    const kept = [];
    const suppressed = new Set();
    for (let i = 0; i < detections.length; i++){
      if (suppressed.has(i)) continue;
      kept.push(detections[i]);
      for (let j = i + 1; j < detections.length; j++){
        if (suppressed.has(j)) continue;
        if (computeIoU(detections[i], detections[j]) > iouThreshold){
          suppressed.add(j);
        }
      }
    }
    return kept;
  }

  /* ---------- Pipeline completo ---------- */
  async function processFrameAI(srcCanvas){
    const sess = await loadModel();
    const { tensor, scale, padX, padY } = preprocess(srcCanvas, INPUT_SIZE);

    const feeds = {};
    feeds[sess.inputNames[0]] = tensor;
    const output = await sess.run(feeds);

    const outName = sess.outputNames[0];
    const raw = output[outName];
    const detections = decodeYOLOv8(raw, CONF_THRESHOLD);
    const kept = nms(detections, IOU_THRESHOLD);

    const pips = kept.map(d => ({
      cx: (d.cx - padX) / scale,
      cy: (d.cy - padY) / scale,
      width: d.w / scale,
      height: d.h / scale,
      minX: (d.x1 - padX) / scale,
      minY: (d.y1 - padY) / scale,
      maxX: (d.x2 - padX) / scale,
      maxY: (d.y2 - padY) / scale,
      area: (d.w / scale) * (d.h / scale),
      conf: d.conf,
      class: d.class
    }));

    // Cada caja = 1 pip. El total es simplemente el número de cajas.
    const total = pips.length;

    return { pips, total, boxCount: pips.length };
  }

  /* =========================================================
     Controlador del modal de cámara
     ========================================================= */
  const CamScanner = (() => {
    const modal = document.getElementById('camModal');
    const video = document.getElementById('camVideo');
    const canvas = document.getElementById('camCanvas');
    const infoEl = document.getElementById('camInfo');
    const btnClose = document.getElementById('camClose');
    const btnCapture = document.getElementById('camCapture');
    const btnRetry = document.getElementById('camRetry');
    const btnAddA = document.getElementById('camAddA');
    const btnAddB = document.getElementById('camAddB');

    let stream = null;
    let result = null;

    function resetUI(){
      result = null;
      video.hidden = false;
      canvas.hidden = true;
      infoEl.innerHTML = 'Apunta la cámara a las fichas y pulsa «Capturar y contar».<br>Consejo: fondo contrastante, luz uniforme, fichas sin solaparse.';
      btnCapture.hidden = false;
      btnCapture.disabled = false;
      btnRetry.hidden = true;
      btnAddA.hidden = true;
      btnAddB.hidden = true;
    }

    async function open(){
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
        alert('Tu navegador no soporta acceso a la cámara (getUserMedia).');
        return;
      }
      resetUI();
      modal.hidden = false;

      try{
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
      } catch(err){
        modal.hidden = true;
        alert('No se pudo acceder a la cámara:\n' + (err.message || err.name));
        return;
      }

      video.srcObject = stream;
      try{ await video.play(); } catch(e){ /* ignora */ }

      loadModel().catch(err => console.warn('Error precargando modelo:', err));
    }

    function close(){
      if (stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      modal.hidden = true;
    }

    async function capture(){
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh){
        infoEl.textContent = 'La cámara aún no está lista. Espera un segundo y reintenta.';
        return;
      }

      canvas.width = vw;
      canvas.height = vh;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, vw, vh);

      infoEl.textContent = 'Procesando con IA…';
      btnCapture.disabled = true;

      let res;
      try{
        res = await processFrameAI(canvas);
      } catch(e){
        console.error(e);
        infoEl.textContent = 'Error procesando la imagen: ' + e.message;
        btnCapture.disabled = false;
        return;
      }

      result = res;
      drawOverlay(ctx, res);
      video.hidden = true;
      canvas.hidden = false;

      const boxes = res.boxCount;
      const t = res.total;

      if (boxes === 0){
        infoEl.innerHTML = 'No se detectaron pips.<br>Prueba con más contraste, mejor luz y las fichas separadas.';
        btnCapture.hidden = true;
        btnRetry.hidden = false;
        btnAddA.hidden = true;
        btnAddB.hidden = true;
      } else {
        infoEl.innerHTML =
          `<strong>${boxes}</strong> pips detectados · ` +
          `Total: <strong style="color:#7bb4ff;font-size:1.1em">${t}</strong><br>` +
          `<span style="font-size:12px;opacity:.7">Revisa los círculos azules antes de añadir.</span>`;
        btnCapture.hidden = true;
        btnRetry.hidden = false;
        btnAddA.hidden = false;
        btnAddB.hidden = false;
      }
    }

    function drawOverlay(ctx, res){
      ctx.save();

      for (const p of res.pips){
        const x = p.minX;
        const y = p.minY;
        const w = p.maxX - p.minX;
        const h = p.maxY - p.minY;

        ctx.strokeStyle = 'rgba(90,162,255,.95)';
        ctx.lineWidth = Math.max(2, Math.round(ctx.canvas.width / 400));
        ctx.strokeRect(x, y, w, h);
      }

      ctx.restore();
    }

    function retry(){ resetUI(); }

    function addTo(column){
      if (!result || !column) return;
      column.addValue(result.total);
      close();
    }

    btnClose.addEventListener('click', close);
    btnCapture.addEventListener('click', capture);
    btnRetry.addEventListener('click', retry);
    btnAddA.addEventListener('click', () => addTo(colA));
    btnAddB.addEventListener('click', () => addTo(colB));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !modal.hidden) close();
    });

    return { open, close };
  })();

  /* =========================================================
     Arranque
     ========================================================= */
  const saved = readStorage();

  if (saved && (typeof saved.threshold === 'string' || typeof saved.threshold === 'number')){
    thresholdEl.value = String(saved.threshold);
  }

  colA = new Column(document.getElementById('col_a'), updateColors, saved ? saved.colA : null);
  colB = new Column(document.getElementById('col_b'), updateColors, saved ? saved.colB : null);

  thresholdEl.addEventListener('input', updateColors);

  resetBtn.addEventListener('click', () => {
    colA.resetRows();
    colB.resetRows();
    updateColors();
  });

  scanBtn.addEventListener('click', () => CamScanner.open());

  loading = false;
  updateColors();
})();
</script>

<!-- Registro del Service Worker para uso offline -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .catch(err => console.warn('Service worker no registrado:', err));
    });
  }
</script>
